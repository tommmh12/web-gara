# ========================
# Server Configuration
# ========================
server.port=8080
spring.application.name=web-gara

# ========================
# MongoDB Configuration
# ========================
spring.data.mongodb.uri=mongodb://localhost:27017/webgara
spring.data.mongodb.auto-index-creation=true

# ========================
# JWT Configuration
# ========================
jwt.secret=YOUR_JWT_SECRET_KEY_CHANGE_THIS_IN_PRODUCTION_MIN_256_BITS
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ========================
# File Upload Configuration
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./uploads

# ========================
# Mail Configuration
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# Swagger / OpenAPI
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
app.api.version=1.0.0
app.api.title=Web-Gara API
app.api.description=Comprehensive Garage Management System for Vietnamese Market

# ========================
# Actuator
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========================
# Logging
# ========================
logging.level.root=INFO
logging.level.com.webgara=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
